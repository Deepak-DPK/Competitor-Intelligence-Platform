<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="competeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle badge -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#competeGradient)" />
  <rect x="5" y="5" width="90" height="90" rx="26" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Outer radar ring -->
  <circle cx="50" cy="50" r="26" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-dasharray="6 4" />
  
  <!-- Intelligence Target Crosshairs & Dynamic Lightning Peak -->
  <path d="M50 20 V30 M50 70 V80 M20 50 H30 M70 50 H80" stroke="white" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Dynamic IQ Trend Arrow -->
  <path d="M34 62 L44 50 L54 56 L68 38" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="58,38 68,38 68,48" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Active radar pulse point -->
  <circle cx="68" cy="38" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="68" cy="38" r="2.5" fill="white" />
</svg>
